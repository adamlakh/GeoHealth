<div class="legend-card">
  @if(isRaster) {
  <div class="gradient-bar grayscale"></div>
  <div class="gradient-labels">
    <span>1.0</span>
    <span>0.5</span>
    <span>0.0</span>
  </div>
  } @else if(isEbola) {
  <div class="gradient-bar"
       [class.ebola-dry]="isDry"
       [class.ebola-wet]="!isDry"></div>
  <div class="gradient-labels">
    <span>0.80</span>
    <span>0.50</span>
    <span>0.20</span>
  </div>
  } @else if(isRiftValley) {
  <div class="gradient-bar rift"></div>
  <div class="gradient-labels">
    <span>High</span>
    <span>Medium</span>
    <span>Low</span>
  </div>
  }
</div>
